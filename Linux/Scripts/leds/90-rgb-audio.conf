# Entrada virtual "RGB Audio": o que toca na saida padrao, para o OpenRGB
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "RGB Audio"
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "rgb_audio.capture"
        stream.capture.sink = true
        node.passive = true
        node.dont-reconnect = false
      }
      playback.props = {
        node.name = "rgb_audio"
        node.description = "RGB Audio"
        media.class = "Audio/Source"
        priority.session = 1
        priority.driver = 1
      }
    }
  }
]
